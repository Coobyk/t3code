[package]
name = "c67-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
  "x11",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol = "2.0.2"
tungstenite = "0.30.0"

unicode-segmentation = "1"
ureq = { version = "3.5.2", features = ["json"] }
